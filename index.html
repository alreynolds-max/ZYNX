<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZYNX</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101010;color:white;font-family:Arial,sans-serif}
header{text-align:center;padding:35px 15px;background:linear-gradient(135deg,#ff5e00,#a000ff)}

button:hover{background:#ff6500}
main{max-width:1000px;margin:auto;padding:20px}

.card{background:#1d1d1d;border:1px solid #383838;border-radius:15px;padding:25px 12px;text-align:center}
.card button{margin-top:10px}
input{padding:13px;border-radius:8px;border:0;width:100%;margin:10px 0;background:#222;color:white}
section{margin-bottom:40px}
footer{text-align:center;padding:30px;color:#888}
</style>
</head>
<body>

<h1>ZYNX</h1>
<p>YOUR WORLD. YOUR RULES.</p>
</header>
<nav>
